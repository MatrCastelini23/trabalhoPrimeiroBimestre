services:
  web-php:
    #build criado para personalizar a imagem de php-apache 8.3 dentro do Dockerfile na pasta web
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web-php
    ports:
      - "8080:80"
    volumes:
      - ./web/src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    container_name: db_job
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: claudinhoEBuchecha
      MARIADB_DATABASE: soLove
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "3306:3306"
    volumes:
      - data_base:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql #volume criado para rodar o SQL dentro do db.sql na raiz do projeto 

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: acesso_banco
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: claudinhoEBuchecha
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  data_base:
