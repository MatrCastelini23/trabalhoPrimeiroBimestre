services:
  web-php:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web-php
    ports:
      - "5000:80"
    volumes:
      - ./web/src:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:11.4
    container_name: db_job
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: claudinhoEBuchecha
      MARIADB_DATABASE: soLove
    ports:
      - "3306:3306"
    volumes:
      - data_base:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: acesso_banco
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: claudinhoEBuchecha
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  data_base:
